<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>万剑归宗 - 赛博修仙 | Cyber Xianxia</title>
    <style>
        :root { --glow: #00f0ff; --bg: #000814; }
        body { margin: 0; overflow: hidden; background: var(--bg); font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; color: var(--glow); }
        canvas { display: block; }
        
        #overlay {
            position: fixed; inset: 0; background: rgba(0,8,20,0.95);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 100; text-align: center; padding: 20px;
        }
        
        .btn-start {
            padding: 15px 50px; font-size: 1.2rem; background: transparent;
            border: 1px solid var(--glow); color: var(--glow); cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.2); transition: 0.3s;
            margin-top: 30px; letter-spacing: 2px;
        }
        .btn-start:hover { background: var(--glow); color: #000; box-shadow: 0 0 40px var(--glow); }

        #ui-status {
            position: absolute; top: 20px; left: 20px; pointer-events: none;
            text-shadow: 0 0 10px var(--glow);
        }

        #v-preview {
            position: absolute; bottom: 10px; right: 10px; width: 150px; height: 110px;
            border: 1px solid var(--glow); border-radius: 4px; transform: scaleX(-1);
            background: #000; opacity: 0.6;
        }
    </style>
</head>
<body>

<div id="overlay">
    <h1 style="font-size: 3rem; margin: 0;">万剑归宗</h1>
    <p style="opacity: 0.7;">Cyber Xianxia: Ten Thousand Swords Return to Sect</p>
    <div id="error-msg" style="color: #ff4d4d; margin-top: 10px; font-size: 0.9rem;"></div>
    <button class="btn-start" onclick="initExperience()">BEGIN RITUAL</button>
</div>

<div id="ui-status">
    <h2 style="margin: 0; font-size: 1.2rem;">万剑归宗 - 赛博修仙</h2>
    <div id="hint">Waiting for hand detection...</div>
</div>

<video id="webcam" playsinline style="display:none;"></video>
<video id="v-preview" autoplay playsinline muted></video>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<script>
    let scene, camera, renderer, swords = [], handData = [];
    const clock = new THREE.Clock();

    function initThree() {
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 60;

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        // Environment
        scene.fog = new THREE.FogExp2(0x000814, 0.01);
        const light = new THREE.PointLight(0x00f0ff, 2, 100);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0xffffff, 0.3));

        // Procedural Sword
        const swordGeo = new THREE.ConeGeometry(0.15, 3, 4);
        const swordMat = new THREE.MeshStandardMaterial({ 
            color: 0x00f0ff, emissive: 0x00f0ff, emissiveIntensity: 1.5 
        });

        for(let i=0; i<300; i++) {
            const sword = new THREE.Mesh(swordGeo, swordMat);
            sword.userData = { vel: new THREE.Vector3(), target: new THREE.Vector3() };
            swords.push(sword);
            scene.add(sword);
        }
    }

    async function initExperience() {
        const errEl = document.getElementById('error-msg');
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "user" } 
            });
            document.getElementById('webcam').srcObject = stream;
            document.getElementById('v-preview').srcObject = stream;
            document.getElementById('overlay').style.display = 'none';
            
            initThree();
            startTracking();
            animate();
        } catch (e) {
            errEl.innerHTML = "Access Denied. Please ensure you are using HTTPS and have granted camera permissions.";
        }
    }

    function startTracking() {
        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });
        hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.5 });
        hands.onResults(results => { handData = results.multiHandLandmarks; });

        const cameraPipe = new Camera(document.getElementById('webcam'), {
            onFrame: async () => { await hands.send({ image: document.getElementById('webcam') }); },
            width: 640, height: 480
        });
        cameraPipe.start();
    }

    function animate() {
        requestAnimationFrame(animate);
        const time = clock.getElapsedTime();
        const hint = document.getElementById('hint');

        swords.forEach((s, i) => {
            let target = new THREE.Vector3();
            if (handData && handData[0]) {
                const p = handData[0][9]; // Palm center
                const tx = (0.5 - p.x) * 100;
                const ty = (0.5 - p.y) * 80;
                
                // Logic for "Circular Orbit" around hand
                const angle = (i/300) * Math.PI * 2 + time * 2;
                target.set(tx + Math.cos(angle)*15, ty + Math.sin(angle)*15, 0);
                hint.innerText = "Sect Master Detected: Controlling Formation";
            } else {
                // Idle spiral
                const angle = (i/300) * Math.PI * 2 + time * 0.5;
                target.set(Math.cos(angle)*30, Math.sin(angle)*20, Math.sin(time + i)*10);
                hint.innerText = "Cultivating... (Show hand to control)";
            }

            s.position.lerp(target, 0.08);
            s.lookAt(target);
            s.rotateX(Math.PI/2);
        });

        renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
  </html>
